[versions]
agp = "9.3.1"
coreKtx = "1.19.0"
appcompat = "1.8.0"
webkit = "1.17.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"
activity = "1.13.0"
material = "1.14.0"
junit = "6.1.3"
mockk = "1.14.11"
# Held at 2.2.2 deliberately, and lint's newer-version notice is answered here
# rather than ignored. Measured on the merged release manifest: 2.3.0 adds
# ACCESS_NETWORK_STATE, RECEIVE_BOOT_COMPLETED and WAKE_LOCK to what the
# installed app asks for, against the two this build records. That is three
# capabilities a user and a Play reviewer both see, bought for nothing this app
# uses; scripts/check-permission-claims.py is what caught it and will catch the
# next attempt too.
playAssetDelivery = "2.2.2"
constraintlayout = "2.2.2"
viewpager2 = "1.1.0"
browser = "1.10.0"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
espresso = "3.7.0"
uiautomator = "2.4.0"
orgJson = "20260814"
# Diligent's Mobile view screens. The compose compiler plugin has to be the
# Kotlin version AGP brings with it (`./gradlew buildEnvironment` lists
# kotlin-gradle-plugin); move both together. Lint offers the newest plugin,
# which would not match, hence the suppression.
#noinspection NewerVersionAvailable
kotlinCompose = "2.2.10"
composeBom = "2026.08.00"
window = "1.5.1"
# Diligent: the QR code on the Share screen. ZXing core only (pure Java, Apache-2.0).
zxing = "3.5.4"
# Diligent: diligent-link (Phase 5). Bouncy Castle (bcprov only) for SRP-6a and
# the ASN.1 of the device certificate, which the platform does not offer.
# Pinned on purpose: a crypto library moves by a reviewed bump, not by lint's
# newest-version notice.
#noinspection NewerVersionAvailable
bouncycastle = "1.85.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
play-asset-delivery = { group = "com.google.android.play", name = "asset-delivery", version.ref = "playAssetDelivery" }
play-asset-delivery-ktx = { group = "com.google.android.play", name = "asset-delivery-ktx", version.ref = "playAssetDelivery" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "viewpager2" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }

org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "window" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
# Diligent: diligent-link's shared library, built from the android/diligent-sync-core submodule.
diligent-sync-core = { group = "com.ditarector.diligent", name = "sync-core", version = "0.1.0" }
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinCompose" }
